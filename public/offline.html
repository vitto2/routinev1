<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Sem conexão - Routine</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#fff;color:#171717;text-align:center;padding:24px}
    img{width:72px;height:72px;border-radius:18px;margin-bottom:16px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#737373;margin:0 0 20px;font-size:14px}
    button{background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:15px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>O Routine precisa de internet para sincronizar seus hábitos. Tente de novo em instantes.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
